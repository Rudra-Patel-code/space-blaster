<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shooting Game</title>
        <link rel="stylesheet" href="/src/style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <div class="scoreBoard">Score: 0</div>

        <div id="timeHUD" style="display: none">00:00</div>

        <form action="" method="get">
            <h1 class="game-title">🚀 Space Blaster</h1>
            <p class="subtitle">Defend. Survive. Dominate.</p>

            <input type="submit" value="🎮 Start Game" />

            <a href="/rules.html" class="rules-link"
                >📜 View Rules & Controls</a
            >
        </form>

        <div class="myGame"></div>

        <div class="leaderboard" id="leaderboard" style="display: none">
            <h2>🌐 Global Leaderboard</h2>
            <ul id="leaderboardList"></ul>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
        integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    ></script>
    <script type="module" src="/src/main.js"></script>
</html>
